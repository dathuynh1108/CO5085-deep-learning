name: CPU unit tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements/torch-cpu.txt
      - run: python -m pip install -r requirements.txt -r requirements/dev.txt
      - run: python -m compileall -q common E1 E2 E3 scripts
      - run: python -m pytest -q
