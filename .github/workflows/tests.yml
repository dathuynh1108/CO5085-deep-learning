name: Notebook checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  notebooks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install nbformat
      - name: Check saved notebook outputs
        run: |
          python - <<'PY'
          from pathlib import Path
          import nbformat
          for name in ('E1', 'E2', 'E3', 'A1', 'A2'):
              notebook = nbformat.read(Path('notebooks') / f'{name}.ipynb', as_version=4)
              nbformat.validate(notebook)
              code_cells = [cell for cell in notebook.cells if cell.cell_type == 'code']
              assert all(cell.execution_count is not None for cell in code_cells), name
              assert not any(output.output_type == 'error' for cell in code_cells for output in cell.get('outputs', [])), name
          PY
      - run: python scripts/build_site.py --output build/site
