name: Initialize coursework artifacts
on:
  push:
    branches: [main]
    paths: ['.github/workflows/initialize.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: initialize-coursework
  cancel-in-progress: false
jobs:
  initialize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - name: Check transferred source against the reviewed ZIP
        run: sha256sum --check .github/transfer-checksums.txt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install CPU test and export dependencies
        run: |
          python -m pip install -r requirements/torch-cpu.txt
          python -m pip install -r requirements.txt -r requirements/dev.txt
      - name: Install report tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends texlive-xetex texlive-latex-extra texlive-lang-other texlive-fonts-recommended fonts-liberation fonts-dejavu-core poppler-utils
      - name: Restore the identical instructor assignment
        run: |
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/dangtai111325/CO5085/b8818bb058fe74b4accec5257847ec6b1e57d835/assignment/exercise-vne.pdf' -o assignments/exercise-vne.pdf
          echo '860206170a913dce21ea09b3c7b4bf7bda11fd63f0cc7c445aaf5508eff30c3b  assignments/exercise-vne.pdf' | sha256sum --check
      - name: Export untrained tables and build the draft PDF
        run: |
          test ! -e reports/exercises.pdf
          test ! -d runs
          python -m scripts.export_report
          python -m scripts.build_report
          pdfinfo reports/exercises.pdf
      - name: Verify code and static site without training
        run: |
          python -m compileall -q common E1 E2 E3 scripts
          python -m pytest -q
          python scripts/build_site.py --output build/site
      - name: Upload report for inspection
        uses: actions/upload-artifact@v4
        with:
          name: initial-report
          path: |
            reports/exercises.pdf
            reports/exercises.log
            reports/generated/manifest.json
          retention-days: 7
      - name: Commit generated artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/generated reports/exercises.pdf assignments/exercise-vne.pdf
          if ! git diff --cached --quiet; then
            git commit -m 'Add untrained report PDF, generated tables and original assignment'
            git push origin HEAD:main
          fi
