name: Build report
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: report
  cancel-in-progress: false
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install XeLaTeX
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends texlive-xetex texlive-latex-extra texlive-lang-other texlive-fonts-recommended fonts-liberation fonts-dejavu-core
      - name: Compile report from committed tables
        run: python -m scripts.build_report
      - name: Commit PDF
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/exercises.pdf
          if ! git diff --cached --quiet; then
            git commit -m 'Build report PDF from committed LaTeX and tables'
            git push origin HEAD:main
          fi
